spring.application.name=football-betting-analytics
server.port=8080

# Database configuration is enabled with the database profile.
spring.profiles.default=setup

# Keep the API key on the backend. Never put it in frontend environment variables.
football-data.base-url=https://api.football-data.org/v4
football-data.api-key=${FOOTBALL_DATA_API_KEY:}

# Odds API requests and credentials remain backend-only.
odds-api.base-url=https://api.the-odds-api.com/v4
odds-api.api-key=${ODDS_API_KEY:}
